<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Suivi Coûts Mobilier</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-connexion">
    <div class="carte-connexion">
        <h1>Suivi Coûts Mobilier</h1>
        <p class="sous-titre" th:text="${atelier.nomAtelier + ' - ' + atelier.commune}">Atelier de Menuiserie</p>

        <div th:if="${param.erreur}" class="message message-erreur">
            Adresse de connexion ou mot de passe incorrect.
        </div>
        <div th:if="${param.deconnecte}" class="message message-succes">
            Vous avez été déconnecté.
        </div>

        <form th:action="@{/connexion}" method="post">
            <div class="champ">
                <label for="email">Adresse de connexion</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="champ">
                <label for="motDePasse">Mot de passe</label>
                <input type="password" id="motDePasse" name="motDePasse" required>
            </div>
            <div class="actions-formulaire">
                <button type="submit" class="btn btn-principal" style="width: 100%;">Se connecter</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
