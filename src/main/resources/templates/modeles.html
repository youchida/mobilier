<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modèles de meubles - Suivi Coûts Mobilier</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/mise-en-page :: topbarMobile}"></div>
<div class="layout">
    <aside th:replace="~{fragments/mise-en-page :: sidebar('modeles')}"></aside>

    <main class="contenu-principal">
        <div class="banniere-visuelle" style="background-image: url('/images/meubles-catalogue.jpg');">
            <div class="banniere-contenu">
                <div>
                    <h1>Modèles de meubles</h1>
                    <p>Catalogue des modèles fabriqués par l'atelier et prix de vente habituels.</p>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/mise-en-page :: messages}"></div>

        <div class="carte" th:if="${modeleEdition == null}">
            <h2>Nouveau modèle de meuble</h2>
            <form th:action="@{/modeles}" method="post">
                <div class="grille-formulaire">
                    <div class="champ">
                        <label for="code">Code unique</label>
                        <input type="text" id="code" name="code" required maxlength="30" placeholder="Ex : MOD-LIT2P">
                    </div>
                    <div class="champ">
                        <label for="nom">Nom du meuble</label>
                        <input type="text" id="nom" name="nom" required maxlength="120" placeholder="Ex : Lit 2 places">
                    </div>
                    <div class="champ">
                        <label for="prixVenteHabituel">Prix de vente habituel en FCFA (facultatif)</label>
                        <input type="number" id="prixVenteHabituel" name="prixVenteHabituel" step="1" min="1">
                    </div>
                </div>
                <div class="champ">
                    <label for="description">Description (facultative)</label>
                    <textarea id="description" name="description" rows="2" maxlength="500"></textarea>
                </div>
                <div class="actions-formulaire">
                    <button type="submit" class="btn btn-principal">Ajouter le modèle</button>
                </div>
            </form>
        </div>

        <div class="carte" th:if="${modeleEdition != null}">
            <h2>Modifier le modèle : <span th:text="${modeleEdition.code}"></span></h2>
            <form th:action="@{/modeles/{id}/modifier(id=${modeleEdition.id})}" method="post">
                <div class="grille-formulaire">
                    <div class="champ">
                        <label for="codeEdit">Code unique</label>
                        <input type="text" id="codeEdit" name="code" th:value="${modeleEdition.code}" required maxlength="30">
                    </div>
                    <div class="champ">
                        <label for="nomEdit">Nom du meuble</label>
                        <input type="text" id="nomEdit" name="nom" th:value="${modeleEdition.nom}" required maxlength="120">
                    </div>
                    <div class="champ">
                        <label for="prixVenteHabituelEdit">Prix de vente habituel en FCFA (facultatif)</label>
                        <input type="number" id="prixVenteHabituelEdit" name="prixVenteHabituel" step="1" min="1" th:value="${modeleEdition.prixVenteHabituel != null ? #numbers.formatDecimal(modeleEdition.prixVenteHabituel, 1, 0) : ''}">
                    </div>
                </div>
                <div class="champ">
                    <label for="descriptionEdit">Description (facultative)</label>
                    <textarea id="descriptionEdit" name="description" rows="2" maxlength="500" th:text="${modeleEdition.description}"></textarea>
                </div>
                <div class="actions-formulaire">
                    <button type="submit" class="btn btn-principal">Enregistrer</button>
                    <a th:href="@{/modeles}" class="btn btn-secondaire">Annuler</a>
                </div>
            </form>
        </div>

        <div class="carte">
            <h2>Catalogue des modèles</h2>
            <p th:if="${#lists.isEmpty(modeles)}" class="vide">Aucun modèle enregistré.</p>

            <div th:if="${!#lists.isEmpty(modeles)}" class="conteneur-tableau">
                <table>
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Nom</th>
                        <th>Description</th>
                        <th class="nombre">Prix de vente habituel</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${modeles}">
                        <td th:text="${m.code}">CODE</td>
                        <td th:text="${m.nom}">Nom</td>
                        <td th:text="${m.description != null ? m.description : '-'}">-</td>
                        <td class="nombre" th:text="${m.prixVenteHabituel != null ? #numbers.formatDecimal(m.prixVenteHabituel, 1, 'WHITESPACE', 0, 'COMMA') + ' FCFA' : '-'}">-</td>
                        <td>
                            <div class="actions-ligne">
                                <a th:href="@{/modeles(modifierId=${m.id})}" class="btn btn-secondaire btn-petit">Modifier</a>
                                <form th:if="${!utilisations[m.id]}" th:action="@{/modeles/{id}/supprimer(id=${m.id})}" method="post">
                                    <button type="submit" class="btn btn-danger btn-petit">Supprimer</button>
                                </form>
                                <span th:if="${utilisations[m.id]}" class="badge badge-gris">Utilisé en fabrication</span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
